name: ForgeMentor Backend Deploy V2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'

permissions:
  id-token: write
  contents: read

env:
  ACR_LOGIN_SERVER: forgementoracr.azurecr.io
  IMAGE_NAME: forgementor-backend
  RESOURCE_GROUP: ForgeMentor-RG
  AKS_CLUSTER: ForgeMentor-AKS
  NAMESPACE: forgementor
  DEPLOYMENT: forgementor-backend


jobs: 
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Inspect GitHub OIDC environment
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Repository owner: $GITHUB_REPOSITORY_OWNER"
          echo "Repository ID: ${{ github.event.repository.id }}"
          echo "Owner ID: ${{ github.event.organization.id }}"
          echo "Workflow: $GITHUB_WORKFLOW"
          echo "Ref: $GITHUB_REF"

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: 661f2bfd-b71f-478b-9e9f-fc47cf923570
          tenant-id: 594a3f12-3ee3-431a-b52d-c3f6e259462d
          subscription-id: eafd4951-3f73-47e9-a333-edb4ab0a1040

      - name: Log in to Azure Container Registry
        run: az acr login --name forgementoracr

      - name: Set image tag
        id: image
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
        
      - name: Build backend
        working-directory: backend
        run: bash mvnw clean package -DskipTests
        
      - name: Build Docker image
        working-directory: backend
        run: docker build -t "${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${{ steps.image.outputs.tag }}" .

      - name: Push Docker image
        run: docker push "${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${{ steps.image.outputs.tag }}"

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group "$RESOURCE_GROUP" --name "$AKS_CLUSTER" --overwrite-existing

      - name: Update deployment image
        run: kubectl set image deployment/$DEPLOYMENT $DEPLOYMENT="${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${{ steps.image.outputs.tag }}" -n "$NAMESPACE"

      - name: Wait for rollout
        run: kubectl rollout status deployment/$DEPLOYMENT -n "$NAMESPACE" --timeout=5m

      - name: Verify deployment
        run: kubectl get deployment/$DEPLOYMENT -n "$NAMESPACE"
