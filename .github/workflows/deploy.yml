name: Deploy ForgeMentor Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ACR_NAME: forgementoracr
  ACR_LOGIN_SERVER: forgementoracr.azurecr.io
  AKS_RESOURCE_GROUP: ForgeMentor-RG
  AKS_CLUSTER_NAME: ForgeMentor-AKS
  AKS_NAMESPACE: forgementor
  IMAGE_NAME: forgementor-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "${ACR_NAME}"

      - name: Build and push backend image
        run: |
          IMAGE="${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker build -t "${IMAGE}" ./backend
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "${AKS_RESOURCE_GROUP}" \
            --name "${AKS_CLUSTER_NAME}" \
            --overwrite-existing

      - name: Ensure namespace exists
        run: kubectl get namespace "${AKS_NAMESPACE}" >/dev/null 2>&1 || kubectl create namespace "${AKS_NAMESPACE}"

      - name: Ensure backend image is deployed
        run: |
          kubectl -n "${AKS_NAMESPACE}" set image deployment/forgementor-backend \
            backend="${IMAGE}"

          kubectl -n "${AKS_NAMESPACE}" rollout status deployment/forgementor-backend --timeout=180s
