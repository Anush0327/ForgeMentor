apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forgementor-backend
  namespace: forgementor
spec:
  ingressClassName: nginx
  rules:
    - host: forgementor.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: forgementor-backend
                port:
                  number: 8080